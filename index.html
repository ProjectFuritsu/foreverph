<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- page tags -->
    <meta name="theme-color" content="#ffffff" />

    <!-- Facebook / Messenger link preview (Open Graph). The title, description,
         link and picture above come from `share` in src/content.js. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ForeverPH" />
    <meta property="og:locale" content="en_PH" />
    <!-- The Facebook Page that owns this site, for the ⓘ panel on shared links.
         Both of the Page's IDs: the one in its link and its Messenger one. -->
    <meta property="fb:pages" content="61595113010562,1358839563976398" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Google shows the icon in search results only if it's square and a
         multiple of 48px, hence 192×192. favicon.ico is for older tools. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Poppins:wght@400;500;600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
